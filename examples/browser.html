<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>inteliOCR — browser example</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0b0e15; color:#e6e9f2; }
    .wrap { max-width: 720px; margin: 48px auto; padding: 0 20px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: #7d849b; margin-bottom: 24px; }
    .panel { background: #141926; border: 1px solid #232a3d; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #b8bfd1; margin-bottom: 12px; font-weight: 500; }
    input[type=file], input[type=text], select {
      display: block; width: 100%; padding: 10px 12px; margin-top: 6px;
      background: #0f1320; color: #e6e9f2; border: 1px solid #232a3d; border-radius: 8px;
      font: inherit; box-sizing: border-box;
    }
    input:focus, select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    button { padding: 10px 18px; background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
             border: none; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { background: #0f1320; border: 1px solid #232a3d; border-radius: 8px; padding: 14px;
          overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 420px; }
    .err { color: #f87171; }
    .ok  { color: #34d399; }
    .row { display: flex; gap: 12px; align-items: center; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
             background: rgba(99,102,241,.15); color: #c7d2fe; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>inteliOCR <span class="badge">browser demo</span></h1>
    <div class="sub">Pick a receipt or invoice image/PDF, send it to the API.</div>

    <div class="panel">
      <label>API key
        <input type="text" id="apiKey" placeholder="ioc_xxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      </label>
      <label>Engine
        <select id="engine">
          <option value="ia">ia · MiniMax Vision (structured)</option>
          <option value="basic">basic · tesseract.js (raw text)</option>
          <option value="v1">v1 · /v1/ocr alias</option>
        </select>
      </label>
      <label>Document type
        <select id="type">
          <option value="receipt">receipt</option>
          <option value="invoice">invoice</option>
        </select>
      </label>
      <label id="langField">Tesseract language (basic)
        <input type="text" id="lang" placeholder="eng" value="eng" autocomplete="off" />
      </label>
      <label>File
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp,application/pdf" />
      </label>
      <div class="row">
        <button id="run" disabled>Process</button>
        <span id="status" class="sub"></span>
      </div>
    </div>

    <div class="panel" id="resultPanel" style="display:none">
      <h3 style="margin:0 0 10px;font-size:14px">Result</h3>
      <pre id="result"></pre>
    </div>
  </div>

  <script src="./javascript-usage.js"></script>
  <script src="./example.js"></script>
</body>
</html>
